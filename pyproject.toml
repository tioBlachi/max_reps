[project]
name = "maxreps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Blas Antunez", email = "blasantunez310@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
